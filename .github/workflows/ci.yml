name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Lint intentionally disabled until existing violations are
      # cleaned up (see TODO in docs/code-review-2026-04-15.md).
      # Re-enable once `pnpm run lint` passes locally.
      - name: Lint (advisory)
        run: pnpm run lint
        continue-on-error: true

      - name: Build
        run: pnpm run build

  docker:
    name: Docker image build & push
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tags=ghcr.io/${{ github.repository_owner }}/websheet:latest,ghcr.io/${{ github.repository_owner }}/websheet:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=websheet-app:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.tags.outputs.push }}
          load: ${{ steps.tags.outputs.push == 'false' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
