name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Lint intentionally disabled until existing violations are
      # cleaned up (see TODO in docs/code-review-2026-04-15.md).
      # Re-enable once `pnpm run lint` passes locally.
      - name: Lint (advisory)
        run: pnpm run lint
        continue-on-error: true

      - name: Build
        run: pnpm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: websheet-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
